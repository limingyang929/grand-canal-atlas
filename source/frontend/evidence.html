<body class="evidence-page">

  <main class="evidence-layout">
    <aside class="evidence-sidebar"><h1>资料依据</h1><p class="dialog-intro">地图附件、遗产名录与历史材料集中阅读。点击地图里的来源编号，可直接回到相应资料。</p><label class="evidence-search-label" for="source-search">查找资料</label><input id="source-search" placeholder="搜索编号、标题或发布机构…"><p id="source-count" class="inventory-count" role="status">正在读取资料目录…</p><details class="source-directory" open><summary>选择资料</summary><div id="source-list" class="source-list"></div></details></aside>
    <section class="evidence-reader" aria-label="资料阅读区">
      <div class="evidence-heading"><div><span class="source-publisher" id="source-publisher"></span><h2 id="source-title">正在加载资料…</h2><p id="source-description" class="dialog-intro"></p></div><div id="source-actions" class="source-actions"></div></div>

      <p id="reader-status" class="reader-status" role="status"></p><div id="source-viewer" class="source-viewer"></div>
      <details class="evidence-metadata"><summary>归档记录与使用说明</summary><p id="source-rights"></p><dl id="source-metadata"></dl></details>
